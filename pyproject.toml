[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-permafrost"
version = "0.5.0"

authors = [
  { name="Grant Viklund" },
  { name="Devon Jackson" },
]
maintainers = [
  { name="Grant Viklund", email="renderbox@gmail.com" },
]
description = "A Django app that adds Client Definable Permissions to Django."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
keywords = ["django", "app"]
dependencies = [
    "Django>=5.2,<6.2",
]

[project.optional-dependencies]
api = [
    "djangorestframework",
    "drf-spectacular>=0.30,<0.31",
]
dev = [
    "black",
    "flake8",
    "flake8-black",
    "mypy",
    "bandit",
    "isort",
    "django-crispy-forms",
    "django-allauth",
    "django-extensions",
    "djangorestframework",
    "drf-spectacular>=0.30,<0.31",
    "toml",
]
docs= [
    "coverage",
]
test = [
    "black",
    "flake8",
    "flake8-black",
    "mypy",
    "bandit",
    "isort",
    "coverage",
    "django-crispy-forms",
    "djangorestframework",
    "drf-spectacular>=0.30,<0.31",
]

[project.urls]
"Homepage" = "https://github.com/renderbox/django-permafrost"
"Bug Tracker" = "https://github.com/renderbox/django-permafrost/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
permafrost = [
    "fixtures/*.json",
    "templates/permafrost/*.html",
    "templates/permafrost/admin/*.html",
    "templates/permafrost/includes/*.html",
]

[tool.black]
target-version = ["py311"]
