name: Python Tests (Master)

on:
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        include:
          - python-version: "3.11"
            django-version: ">=5.2,<5.3"
          - python-version: "3.12"
            django-version: ">=5.2,<5.3"
          - python-version: "3.12"
            django-version: ">=6.0,<6.1"
          - python-version: "3.12"
            django-version: ">=6.1,<6.2"
          - python-version: "3.13"
            django-version: ">=5.2,<5.3"
          - python-version: "3.13"
            django-version: ">=6.0,<6.1"
          - python-version: "3.13"
            django-version: ">=6.1,<6.2"
          - python-version: "3.14"
            django-version: ">=5.2,<5.3"
          - python-version: "3.14"
            django-version: ">=6.0,<6.1"
          - python-version: "3.14"
            django-version: ">=6.1,<6.2"
          - python-version: "3.15-dev"
            django-version: ">=6.1,<6.2"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]" "Django${{ matrix.django-version }}"

      - name: Check code with black
        run: |
          black --check .

      - name: Test with Django Test
        run: |
          cd develop
          python manage.py makemigrations --check --dry-run
          python manage.py test permafrost
        env:
          DJANGO_DEBUG: 1

  package:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install -U pip
          python -m pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*
