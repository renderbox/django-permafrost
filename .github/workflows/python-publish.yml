name: Publish Python 🐍 distribution 📦 to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to publish"
        required: true
        default: "master"
        type: string

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record publish ref
        run: echo "PUBLISH_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install -U pip
          python -m pip install build twine --user

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Store publish metadata
        run: echo "${PUBLISH_SHA}" > publish-sha.txt

      - name: Upload publish metadata
        uses: actions/upload-artifact@v4
        with:
          name: publish-metadata
          path: publish-sha.txt

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-permafrost # PyPI project name
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1.12
        # with:
        #   user: __token__
        #   password: ${{ secrets.pypi_password }}

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Download publish metadata
        uses: actions/download-artifact@v4
        with:
          name: publish-metadata
          path: .

      - name: Read publish metadata
        run: echo "PUBLISH_SHA=$(cat publish-sha.txt)" >> $GITHUB_ENV

      # Extract the version directly from a built .whl file
      - name: Extract version from Python package
        id: get_version
        run: |
          VERSION=$(ls dist/*.whl | head -n 1 | awk -F'-' '{print $2}')
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v2.1.1
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release create
          "v${{ env.PACKAGE_VERSION }}"
          --repo '${{ github.repository }}'
          --target "${{ env.PUBLISH_SHA }}"
          --title "Release v${{ env.PACKAGE_VERSION }}"
          --notes "Release for version ${{ env.PACKAGE_VERSION }}"

      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Upload to GitHub Release using the `gh` CLI.
        # `dist/` contains the built packages, and the
        # sigstore-produced signatures and certificates.
        run: >-
          gh release upload
          "v${{ env.PACKAGE_VERSION }}" dist/**
          --repo '${{ github.repository }}'
