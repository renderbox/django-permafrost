{% load i18n %}

<div class="modal-header">
    <h2 class="h5 modal-title font-weight-bold text-gray-900" id="form-modal-title">{% trans 'Add Permissions' %}</h2>
    <button type="button" class="close text-success" data-dismiss="modal" aria-label="{% trans 'Close' %}"><span aria-hidden="true">&times;</span></button>
</div>
<div class="modal-body" style="overflow-y: auto; max-height: 50vh;">
    {% if obj_title %}<h3 class="h5 text-primary-grey mb-3">{{ obj_title }}</h3>{% endif %}
    <div class="col-12">
        <div class="form-group">
            <label for="search_field">{% trans 'Search permissions' %}</label>
            <div class="input-group">
                <input type="search" id="search_field" class="textinput textInput flex-fill" autocomplete="off">
                <div class="input-group-append">
                    <button class="btn btn-outline-secondary" type="button" id="search_close" aria-label="{% trans 'Clear permission search' %}"><i class="fa fa-times" aria-hidden="true"></i></button>
                    <button id="search_button" class="btn btn-success" type="button"><i class="fas fa-search" aria-hidden="true"></i><span class="sr-only">{% trans 'Search permissions' %}</span></button>
                </div>
            </div>
        </div>
        <form method="post" action="{% url 'permafrost:custom-role-add-permissions' slug=object.slug %}" id="perm-modal-form">
            {% csrf_token %}
            <div id="perm-table" aria-live="polite">{% include 'permafrost/includes/permissions_table.html' %}</div>
        </form>
    </div>
</div>
<div class="modal-footer">
    <button class="btn btn-link text-success font-weight-bold mr-3" type="button" data-dismiss="modal">{% trans 'Cancel' %}</button>
    <button type="submit" class="btn btn-success font-weight-bold" form="perm-modal-form">{% trans 'Add' %}</button>
</div>

<script>
    (function () {
        var searchField = document.getElementById('search_field');
        var clearButton = document.getElementById('search_close');

        function updatePermissions() {
            var url = "{% url 'permafrost:custom-role-add-permissions' slug=object.slug %}?q=" + encodeURIComponent(searchField.value);
            $('#perm-table').load(url);
        }

        document.getElementById('search_button').addEventListener('click', updatePermissions);
        searchField.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                updatePermissions();
            }
        });
        clearButton.addEventListener('click', function () {
            searchField.value = '';
            updatePermissions();
            searchField.focus();
        });
    }());
</script>
